name: Java CI integrationTests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:

    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [25]


    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customerdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: ${{matrix.java}}
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn test
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/customerdb
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root
        
    - name: Build Package
      run: mvn -B package -DskipTests

    - name: Login to Dockerhub
      if: github.event_name == 'push'
      run: echo "${{secrets.DOCKERHUB_TOKEN}}" | docker login -u "${{secrets.DOCKERHUB_USERNAME}}" --password-stdin

    - name: Docker build
      if: github.event_name == 'push'
      run: |
        docker build -t ${{secrets.DOCKERHUB_USERNAME}}/customer-service:${{github.run_number}} .

    - name: Push to dockerhub
      if: github.event_name == 'push'
      run: |
        docker push ${{secrets.DOCKERHUB_USERNAME}}/customer-service:${{github.run_number}}



